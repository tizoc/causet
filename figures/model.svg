<svg viewBox="0 0 680 232" role="img" aria-labelledby="model-t" xmlns="http://www.w3.org/2000/svg">
  <title id="model-t">Your code sends an Action to a component. Its reducer emits an Effect to a Service, which answers with an Event; the adapter turns the Event into an Action for the same component.</title>
