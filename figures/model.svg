  <text class="svg-label" x="20" y="64">your code</text>
  <line class="svg-line" x1="92" y1="60" x2="208" y2="60" marker-end="url(#model-ah)"/>
  <text class="svg-label" x="128" y="50">Action</text>
  <rect class="svg-box" x="210" y="24" width="170" height="104" rx="4"/>
  <text class="svg-title" x="228" y="50">Component</text>
  <text class="svg-mono" x="228" y="76">reducer</text>
  <text class="svg-mono" x="228" y="96">State</text>
  <line class="svg-line" x1="380" y1="60" x2="478" y2="60" marker-end="url(#model-ah)"/>
