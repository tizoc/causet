<svg viewBox="0 0 680 262" role="img" aria-labelledby="production-test-t" xmlns="http://www.w3.org/2000/svg">
  <title id="production-test-t">The same components run against the real world in production and a simulated one in a test.</title>
  <defs><marker id="production-test-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="svg-head" d="M0 0 L10 5 L0 10 z"/></marker></defs>
  <text class="svg-cap" x="20" y="16">IN PRODUCTION</text>
  <text class="svg-cap" x="370" y="16">IN A TEST</text>
  <rect class="svg-box" x="20" y="30" width="290" height="58" rx="4"/>
  <text class="svg-title" x="40" y="55">The world</text>
  <text class="svg-mono" x="40" y="75">network · disk · clock</text>
  <rect class="svg-box soft" x="370" y="30" width="290" height="58" rx="4"/>
  <text class="svg-title" x="390" y="55">A simulated world</text>
  <text class="svg-mono" x="390" y="75">network · disk · virtual clock</text>
  <line class="svg-line" x1="120" y1="176" x2="120" y2="90" marker-end="url(#production-test-ah)"/>
  <line class="svg-line" x1="210" y1="90" x2="210" y2="174" marker-end="url(#production-test-ah)"/>
  <text class="svg-label" x="112" y="137" text-anchor="end">Effects</text>
  <text class="svg-label" x="218" y="137">Events</text>
  <line class="svg-line" x1="470" y1="176" x2="470" y2="90" marker-end="url(#production-test-ah)"/>
  <line class="svg-line" x1="560" y1="90" x2="560" y2="174" marker-end="url(#production-test-ah)"/>
  <text class="svg-label" x="462" y="137" text-anchor="end">Effects</text>
  <text class="svg-label" x="568" y="137">Events</text>
  <rect class="svg-box" x="20" y="178" width="290" height="74" rx="4"/>
  <text class="svg-title" x="40" y="203">Your components</text>
  <text class="svg-label" x="40" y="223">one input at a time,</text>
  <text class="svg-label" x="40" y="240">in a fixed order</text>
  <rect class="svg-box" x="370" y="178" width="290" height="74" rx="4"/>
  <text class="svg-title" x="390" y="203">The same components</text>
  <text class="svg-label" x="390" y="223">the test decides what arrives,</text>
  <text class="svg-label" x="390" y="240">and when</text>
</svg>
